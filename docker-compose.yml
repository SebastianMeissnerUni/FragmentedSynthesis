version: "3.9"

services:
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile.frontend
    image: fragmentedsynthesis-frontend:latest
    ports:
      - "5173:80"
    environment:
      FRONTEND_URL: "http://localhost:5173"
      VITE_API_URL: "http://localhost:3000"
    depends_on:
      - backend
    networks:
      - appnet

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile.backend
    image: fragmentedsynthesis-backend:latest
    ports:
      - "3000:3000"
    environment:
      GITHUB_CLIENT_ID: "Ov23livXgBq4ImJhZMyP"
      GITHUB_CLIENT_SECRET: "08d900f5163d419c268265cf48c4fb6d2bbaab34"
      GITHUB_REDIRECT_URI: "http://localhost:3000/auth/github/callback"
      FRONTEND_URL: "http://localhost:5173"
    volumes:
      - ./Backend/database.sqlite:/app/database.sqlite
    networks:
      - appnet

networks:
  appnet:
