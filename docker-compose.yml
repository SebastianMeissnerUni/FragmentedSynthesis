      GITHUB_REDIRECT_URI: "http://localhost:3000/auth/github/callback" #domain.de/auth/github/callback


      FRONTEND_URL: "http://localhost:5173" #serverdomain


      JWT_SECRET: "SECRET123"

    networks:
