    ports:
      - "5173:80" #80:80
    environment:
      # Frontend-URL für Redirects
      FRONTEND_URL: "http://localhost:5173" #serverdomain


      VITE_API_URL: "http://backend:3000"

    depends_on:
      - backend
    networks:
      - appnet

